    <script>
      (() => {
        const button = document.getElementById("themeToggle");
        if (!button) return;
        const darkLabel = "Cambiar a tema oscuro";
        const lightLabel = "Cambiar a tema claro";
        const applyTheme = (theme, persist = true) => {
          const next = theme === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = next;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = next === "dark" ? "#090a0c" : "#f4f1e8";
          button.setAttribute("aria-pressed", String(next === "dark"));
          button.setAttribute("aria-label", next === "dark" ? lightLabel : darkLabel);
          button.setAttribute("title", next === "dark" ? lightLabel : darkLabel);
          if (persist) {
            try { localStorage.setItem("portfolio-theme", next); } catch (_) {}
          }
        };
        button.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
        applyTheme(document.documentElement.dataset.theme, false);
      })();
    </script>
